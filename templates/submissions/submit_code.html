<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Problem - Modern Interface</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            height: calc(100vh - 40px);
        }

        .panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .problem-panel {
            animation: slideInLeft 0.6s ease-out;
        }

        .solution-panel {
            animation: slideInRight 0.6s ease-out;
        }

        @keyframes slideInLeft {
            from { transform: translateX(-30px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideInRight {
            from { transform: translateX(30px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .problem-title {
            font-size: 2rem;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .problem-title i {
            color: #667eea;
        }

        .description {
            font-size: 1rem;
            line-height: 1.7;
            color: #4a5568;
            margin-bottom: 24px;
            background: #f7fafc;
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #667eea;
        }

        .section-header {
            font-size: 1.2rem;
            font-weight: 600;
            color: #2d3748;
            margin: 24px 0 12px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-header i {
            color: #667eea;
            font-size: 1rem;
        }

        .format-text {
            color: #4a5568;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .sample-box {
            background: #1a202c;
            color: #e2e8f0;
            padding: 16px;
            border-radius: 8px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 0.9rem;
            line-height: 1.4;
            margin-bottom: 16px;
            position: relative;
            overflow-x: auto;
        }

        .sample-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 8px 8px 0 0;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 8px;
            font-size: 1rem;
        }

        .code-textarea {
            width: 100%;
            height: 300px;
            padding: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 14px;
            line-height: 1.5;
            resize: vertical;
            transition: all 0.3s ease;
            background: #1a202c;
            color: #e2e8f0;
        }

        .code-textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
        }

        .language-select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            background: white;
            color: #2d3748;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .language-select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            justify-content: center;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .language-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #667eea;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 16px;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                gap: 16px;
                height: auto;
            }
            
            .panel {
                padding: 24px;
            }
            
            .problem-title {
                font-size: 1.5rem;
            }
            
            .code-textarea {
                height: 250px;
            }
        }

        /* Custom scrollbar */
        .panel::-webkit-scrollbar {
            width: 6px;
        }

        .panel::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 3px;
        }

        .panel::-webkit-scrollbar-thumb {
            background: rgba(102, 126, 234, 0.5);
            border-radius: 3px;
        }

        .panel::-webkit-scrollbar-thumb:hover {
            background: rgba(102, 126, 234, 0.7);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Problem Panel -->
        <div class="panel problem-panel">
            <h1 class="problem-title">
                <i class="fas fa-code"></i>
                {{ problem.title }}
            </h1>
            
            <div class="description">
                {{ problem.description }}
            </div>

            <div class="section-header">
                <i class="fas fa-download"></i>
                Input Format
            </div>
            <p class="format-text">
                {{ problem.input_format }}
            </p>

            <div class="section-header">
                <i class="fas fa-upload"></i>
                Output Format
            </div>
            <p class="format-text">
                {{ problem.output_format }}
            </p>

            <div class="section-header">
                <i class="fas fa-play"></i>
                Sample Input
            </div>
            <div class="sample-box">{{ problem.sample_input }}</div>

            <div class="section-header">
                <i class="fas fa-check"></i>
                Sample Output
            </div>
            <div class="sample-box">{{ problem.sample_output }}</div>
        </div>

        <!-- Solution Panel -->
        <div class="panel solution-panel">
            <form method="post" style="height: 100%; display: flex; flex-direction: column;">
                <!-- CSRF token would go here in Django -->
                
                <div class="form-group">
                    <label class="form-label" for="language">
                        <i class="fas fa-code"></i> Choose Language
                    </label>
                    <select id="language" name="language" class="language-select">
                        <option value="python">🐍 Python</option>
                        <option value="java">☕ Java</option>
                        <option value="cpp">⚡ C++</option>
                        <option value="javascript">🟨 JavaScript</option>
                    </select>
                </div>

                <div class="form-group" style="flex: 1; display: flex; flex-direction: column;">
                    <label class="form-label" for="code">
                        <i class="fas fa-edit"></i> Your Solution
                    </label>
                    <textarea 
                        id="code" 
                        name="code" 
                        class="code-textarea" 
                        placeholder="# Write your solution here...
def two_sum(nums, target):
    # Your code here
    pass"
                        style="flex: 1;"
                    ></textarea>
                </div>

                <button type="submit" class="submit-btn">
                    <i class="fas fa-paper-plane"></i>
                    Submit Solution
                </button>
            </form>
        </div>
    </div>

    <script>
        // Add syntax highlighting placeholder for different languages
        const codeTextarea = document.getElementById('code');
        const languageSelect = document.getElementById('language');
        
        const templates = {
            python: `# Write your solution here...
def two_sum(nums, target):
    # Your code here
    pass`,
            java: `// Write your solution here...
public class Solution {
    public int[] twoSum(int[] nums, int target) {
        // Your code here
        return new int[]{};
    }
}`,
            cpp: `// Write your solution here...
#include <vector>
using namespace std;

class Solution {
public:
    vector<int> twoSum(vector<int>& nums, int target) {
        // Your code here
        return {};
    }
};`,
            javascript: `// Write your solution here...
function twoSum(nums, target) {
    // Your code here
    return [];
}`
        };

        languageSelect.addEventListener('change', function() {
            const selectedLang = this.value;
            if (codeTextarea.value.trim() === '' || codeTextarea.value.includes('// Write your solution here...') || codeTextarea.value.includes('# Write your solution here...')) {
                codeTextarea.value = templates[selectedLang];
            }
        });

        // Auto-resize textarea
        codeTextarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.max(300, this.scrollHeight) + 'px';
        });

        // Add keyboard shortcut for submission (Ctrl+Enter)
        codeTextarea.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                document.querySelector('.submit-btn').click();
            }
        });
    </script>
</body>
</html>
